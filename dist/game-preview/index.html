<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf6eb">
  <meta name="description" content="Візуальний план гри Word Cottage: 36 зображень, які можна переглядати крок за кроком у браузері.">
  <title>Гра Word Cottage — візуальний план</title>
  <link rel="stylesheet" href="style.css">
  <script src="gallery.js" defer></script>
</head>
<body>
  <header class="header">
    <div><a class="brand" href="../">Word Cottage</a><h1>Візуальний план гри</h1></div>
    <a class="phone-link" href="#33">На телефоні</a>
  </header>
  <main>
    <div class="screen-heading">
      <h2 id="screen-title">Перший вхід</h2>
      <span id="counter" role="status" aria-live="polite" aria-atomic="true">1 / 36</span>
    </div>
    <figure class="image-stage" id="image-stage" tabindex="0" aria-label="Зображення концепції гри">
      <img id="screen-image" src="images/01-welcome.jpg" width="1024" height="683" alt="Перший вхід — екран 1 візуального плану гри" fetchpriority="high">
    </figure>
    <p class="load-status" id="load-status" role="status" hidden>Завантаження зображення…</p>
    <div class="error" id="load-error" role="alert" hidden>
      <p>Не вдалося завантажити зображення. Спробуйте ще раз.</p>
      <button type="button" id="retry">Повторити</button>
    </div>
    <div class="image-tools" id="image-tools" hidden>
      <button type="button" id="zoom" aria-pressed="false" aria-controls="image-stage">Збільшити</button>
      <a id="open-image" href="images/01-welcome.jpg" target="_blank" rel="noopener">Відкрити зображення ↗</a>
    </div>
    <nav class="navigation" id="navigation" aria-label="Перегляд екранів" hidden>
      <button type="button" id="previous" disabled aria-label="Попереднє зображення">← Назад</button>
      <label class="screen-picker"><span class="sr-only">Обрати екран</span><select id="screen-select" aria-label="Обрати екран"></select></label>
      <button type="button" id="next" aria-label="Наступне зображення">Далі →</button>
    </nav>
    <noscript>
      <p>Відкривайте зображення зі списку нижче.</p>
      <ol class="fallback-list">
        <li><a href="images/01-welcome.jpg">Перший вхід</a></li>
